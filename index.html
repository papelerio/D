<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tilemap Editor</title>
   <link rel="icon" href="http://imgfz.com/i/jq7hPbo.png" type="image/png">
  <style>
    body { margin: 0; display: flex; font-family: sans-serif; background: #eee; color: #000; }
    #canvas { flex: 1; background: #eee; cursor: crosshair; }
    #left-sidebar { width: 300px; background: #ddd; padding: 10px; display: flex; flex-direction: column; }
    #right-sidebar { width: 300px; background: #ddd; padding: 10px; display: flex; flex-direction: column; }
    .section { margin-bottom: 10px; padding: 5px; background: #ccc; border-radius: 6px; position: relative; }
    .section h3 { margin: 0 0 5px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn { 
      background: #4caf50; 
      color: white; 
      border: none; 
      border-radius: 3px; 
      width: 20px; 
      height: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      font-size: 12px; 
      padding: 0;
    }
    button { margin: 2px; padding: 5px; cursor: pointer; }
    #textures { display: flex; flex-wrap: wrap; }
    #textures img { width: 40px; height: 40px; margin: 2px; border: 2px solid transparent; cursor: pointer; }
    #textures img.selected { border-color: red; }
    #shortcuts { display: flex; flex-wrap: wrap; }
    #shortcuts .shortcut { width: 50px; margin: 5px; text-align: center; cursor: pointer; }
    #shortcuts .shortcut img { width: 40px; height: 40px; border: 2px solid transparent; }
    #shortcuts .shortcut.selected img { border-color: red; }
    #shortcuts .shortcut .tag { font-size: 10px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
    .section-content { display: block; }
    .section-content.collapsed { display: none; }
    #eventModal, #confirmModal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
    #eventModal .content, #confirmModal .content { background:#fff; padding:20px; border-radius:10px; text-align:center; }
  </style>
</head>
<body>
  <!-- Sidebar izquierdo con Texturas y Tags -->
  <div id="left-sidebar">
    <div class="section">
      <h3>
        <span>Texturas (BBCode)</span>
        <button class="toggle-btn" onclick="toggleSection('textures')">-</button>
      </h3>
      <div id="textures-content" class="section-content">
        <input type="text" id="bbcodeInput" placeholder="[img]http://...[/img]">
        <button onclick="importTexture()">Importar</button>
        <div id="textures"></div>
      </div>
    </div>
    <div class="section">
      <h3>
        <span>Tags</span>
        <button class="toggle-btn" onclick="toggleSection('tags')">-</button>
      </h3>
      <div id="tags-content" class="section-content">
        <input type="text" id="tagInput" placeholder="Escribir tag">
        <button onclick="addTag()">Agregar Tag</button>
        <div id="tags"></div>
      </div>
    </div>
    <div class="section">
      <h3>
        <span>Atajos</span>
        <button onclick="addShortcut()" style="padding:0 5px; font-size:12px;">+</button>
      </h3>
      <div id="shortcuts"></div>
    </div>
  </div>

  <!-- Canvas central -->
  <canvas id="canvas"></canvas>

  <!-- Sidebar derecho con las demás opciones -->
  <div id="right-sidebar">
    <div class="section">
      <h3>Herramientas</h3>
      <div class="section-content">
        <button onclick="setTool('move')">Mover (1)</button>
        <button onclick="setTool('paint')">Pintar (2)</button>
        <button onclick="setTool('erase')">Borrador (3)</button>
        <button onclick="openEventModal()">Evento (4)</button>
        <button onclick="clearAllConfirm()">Limpiar Todo (5)</button>
      </div>
    </div>
    <div class="section">
      <h3>JSON</h3>
      <div class="section-content">
        <button onclick="downloadJSON()">Descargar JSON</button>
        <input type="file" id="jsonFile" onchange="importJSON(event)">
      </div>
    </div>
    <div class="section">
      <h3>Vista del Nivel</h3>
      <div class="section-content">
        <label><input type="radio" name="viewMode" value="static" onchange="setViewMode(this.value)"> Vista estática completa</label><br>
        <label><input type="radio" name="viewMode" value="x" onchange="setViewMode(this.value)"> Vista desplazada solo en eje X</label><br>
        <label><input type="radio" name="viewMode" value="y" onchange="setViewMode(this.value)"> Vista desplazada solo en eje Y</label><br>
        <label><input type="radio" name="viewMode" value="xy" onchange="setViewMode(this.value)"> Vista desplazada en eje X y Y</label>
      </div>
    </div>
  </div>

  <!-- Modales -->
  <div id="eventModal">
    <div class="content">
      <h3>Insertar número de evento</h3>
      <input type="number" id="eventNumber" placeholder="Ej: 1">
      <div style="margin-top:10px;">
        <button onclick="confirmEvent()">Aceptar</button>
        <button onclick="closeEventModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="confirmModal">
    <div class="content">
      <h3>¿Seguro que deseas limpiar todo?</h3>
      <div style="margin-top:10px;">
        <button onclick="doClearAll()">Sí</button>
        <button onclick="closeConfirmModal()">No</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth - 600; // Restamos el ancho de ambos sidebars
    canvas.height = window.innerHeight;

    let tileSize = 32;
    let offsetX = 0, offsetY = 0;
    let tool = 'paint';
    let textures = [];
    let selectedTexture = null;
    let isDragging = false;
    let dragButton = null;
    let startX, startY;
    let eventModeNumber = null;
    let tags = [];
    let selectedTag = null;
    let undoStack = [], redoStack = [];
    let shortcuts = [];

    let mapData = {}; // {"x,y": {type:'masa'|'evento', texture?, tags?, event?}}
    let viewMode = "static";

    function setViewMode(mode){
      viewMode = mode;
    }

    function updateViewModeUI(){
      document.querySelectorAll('input[name="viewMode"]').forEach(r=>{
        r.checked = (r.value === viewMode);
      });
    }

    function pushHistory(){
      undoStack.push(JSON.stringify(mapData));
      if(undoStack.length>50) undoStack.shift();
      redoStack=[];
    }

    function undo(){
      if(undoStack.length){
        redoStack.push(JSON.stringify(mapData));
        mapData = JSON.parse(undoStack.pop());
        draw();
      }
    }

    function redo(){
      if(redoStack.length){
        undoStack.push(JSON.stringify(mapData));
        mapData = JSON.parse(redoStack.pop());
        draw();
      }
    }

    function setTool(t){ tool = t; }

    function clearAllConfirm(){
      document.getElementById('confirmModal').style.display='flex';
    }
    function closeConfirmModal(){
      document.getElementById('confirmModal').style.display='none';
    }
    function doClearAll(){
      mapData={};
      closeConfirmModal();
      draw();
    }

    function openEventModal(){ document.getElementById('eventModal').style.display='flex'; }
    function closeEventModal(){ document.getElementById('eventModal').style.display='none'; }
    function confirmEvent(){
      const num=document.getElementById('eventNumber').value;
      if(num){ eventModeNumber=parseInt(num); tool='event'; }
      closeEventModal();
    }

    function importTexture(){
      const input=document.getElementById('bbcodeInput').value.trim();
      const match=input.match(/\[img\](.*?)\[\/img\]/i);
      if(match){
        const url=match[1];
        const img=new Image();
        img.src=url;
        img.onload=()=>draw();
        textures.push({url,img});
        updateTexturesUI();
      }
    }

    function updateTexturesUI(){
      const div=document.getElementById('textures');
      div.innerHTML='';
      textures.forEach((tex,i)=>{
        const el=document.createElement('img');
        el.src=tex.url;
        el.onclick=()=>{
          selectedTexture=tex;
          document.querySelectorAll('#textures img').forEach(im=>im.classList.remove('selected'));
          el.classList.add('selected');
          checkSelectedShortcut();
        };
        div.appendChild(el);
      });
    }

    function addTag(){
      const input=document.getElementById('tagInput').value.trim();
      if(input){
        tags.push(input);
        updateTagsUI();
        document.getElementById('tagInput').value='';
      }
    }
    
    function updateTagsUI(){
      const div=document.getElementById('tags');
      div.innerHTML='';
      tags.forEach(tag=>{
        const btn=document.createElement('button');
        btn.textContent=tag;
        btn.onclick=()=>{
          selectedTag=tag;
          document.querySelectorAll('#tags button').forEach(b=>b.style.border='');
          btn.style.border='2px solid red';
          checkSelectedShortcut();
        };
        div.appendChild(btn);
      });
    }

    function addShortcut(){
      if (!selectedTexture || !selectedTag) {
        alert('Debes seleccionar una textura y un tag primero');
        return;
      }
      
      // Verificar si ya existe este atajo
      const exists = shortcuts.some(s => s.texture === selectedTexture.url && s.tag === selectedTag);
      if (exists) {
        alert('Este atajo ya existe');
        return;
      }
      
      shortcuts.push({
        texture: selectedTexture.url,
        tag: selectedTag
      });
      
      updateShortcutsUI();
    }
    
    function updateShortcutsUI(){
      const div = document.getElementById('shortcuts');
      div.innerHTML = '';
      
      shortcuts.forEach((shortcut, index) => {
        const shortcutDiv = document.createElement('div');
        shortcutDiv.className = 'shortcut';
        shortcutDiv.onclick = () => {
          // Seleccionar la textura correspondiente
          selectedTexture = textures.find(t => t.url === shortcut.texture);
          if (selectedTexture) {
            document.querySelectorAll('#textures img').forEach(img => {
              img.classList.remove('selected');
              if (img.src === selectedTexture.url) {
                img.classList.add('selected');
              }
            });
          }
          
          // Seleccionar el tag correspondiente
          selectedTag = shortcut.tag;
          document.querySelectorAll('#tags button').forEach(btn => {
            btn.style.border = '';
            if (btn.textContent === selectedTag) {
              btn.style.border = '2px solid red';
            }
          });
          
          // Cambiar a herramienta de pintar
          setTool('paint');
          
          // Resaltar el atajo seleccionado
          checkSelectedShortcut();
        };
        
        const img = document.createElement('img');
        img.src = shortcut.texture;
        
        const tagSpan = document.createElement('div');
        tagSpan.className = 'tag';
        tagSpan.textContent = shortcut.tag;
        
        shortcutDiv.appendChild(img);
        shortcutDiv.appendChild(tagSpan);
        div.appendChild(shortcutDiv);
      });
      
      checkSelectedShortcut();
    }
    
    function checkSelectedShortcut(){
      // Quitar selección de todos los atajos
      document.querySelectorAll('.shortcut').forEach(el => {
        el.classList.remove('selected');
      });
      
      // Si hay una textura y tag seleccionados, buscar coincidencia con atajos
      if (selectedTexture && selectedTag) {
        const index = shortcuts.findIndex(s => 
          s.texture === selectedTexture.url && s.tag === selectedTag
        );
        
        if (index !== -1) {
          // Resaltar el atajo correspondiente
          const shortcutElements = document.querySelectorAll('.shortcut');
          if (shortcutElements[index]) {
            shortcutElements[index].classList.add('selected');
          }
        }
      }
    }
    
    function toggleSection(sectionId){
      const content = document.getElementById(`${sectionId}-content`);
      const btn = content.parentElement.querySelector('.toggle-btn');
      
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        btn.textContent = '-';
      } else {
        content.classList.add('collapsed');
        btn.textContent = '+';
      }
    }

    // --- Eventos de mouse ---
    canvas.addEventListener('mousedown', e=>{
      isDragging=true;
      dragButton=e.button;
      startX=e.offsetX;
      startY=e.offsetY;
      if(dragButton===0){ // click izquierdo
        handleAction(e);
      }
    });

    canvas.addEventListener('mousemove', e=>{
      if(isDragging){
        if(dragButton===1){ // rueda presionada -> mover
          offsetX+=e.movementX;
          offsetY+=e.movementY;
          draw();
        } else if(dragButton===0){ 
          handleAction(e);
        }
      }
    });

    canvas.addEventListener('mouseup', ()=>{ isDragging=false; dragButton=null; });

    // --- Zoom con rueda ---
    canvas.addEventListener('wheel', e=>{
      e.preventDefault();
      if(e.deltaY<0) tileSize=Math.min(tileSize+2,128);
      else tileSize=Math.max(tileSize-2,8);
      draw();
    });

    function handleAction(e){
      const x=Math.floor((e.offsetX-offsetX)/tileSize);
      const y=Math.floor((e.offsetY-offsetY)/tileSize);
      const key=x+','+y;
      if(tool==='paint' && selectedTexture && selectedTag){
        pushHistory();
        mapData[key]={type:'masa', texture:selectedTexture.url, tags:[selectedTag]};
      } else if(tool==='erase'){
        pushHistory();
        delete mapData[key];
      } else if(tool==='event' && eventModeNumber!=null){
        pushHistory();
        mapData[key]={type:'evento', event:eventModeNumber};
      }
      draw();
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(let key in mapData){
        const [x,y]=key.split(',').map(Number);
        const cell=mapData[key];
        const px=x*tileSize+offsetX;
        const py=y*tileSize+offsetY;
        if(cell.type==='masa' && cell.texture){
          const tex=textures.find(t=>t.url===cell.texture);
          if(tex){ ctx.drawImage(tex.img,px,py,tileSize,tileSize); }
          if(cell.tags && cell.tags.length){
            ctx.fillStyle='black';
            ctx.font=Math.floor(tileSize/4)+'px sans-serif';
            ctx.textAlign='center';
            ctx.fillText(cell.tags[0],px+tileSize/2,py+12);
          }
        } else if(cell.type==='evento'){
          ctx.fillStyle='rgba(255,0,0,0.5)';
          ctx.fillRect(px,py,tileSize,tileSize);
          ctx.fillStyle='#000';
          ctx.font=Math.floor(tileSize/2)+'px sans-serif';
          ctx.textAlign='center';
          ctx.fillText(cell.event,px+tileSize/2,py+tileSize/2+5);
        }
      }
      // Dibujar grilla
      ctx.strokeStyle='#ccc';
      for(let x=0;x<canvas.width;x+=tileSize){
        ctx.beginPath();ctx.moveTo(x+offsetX%tileSize,0);ctx.lineTo(x+offsetX%tileSize,canvas.height);ctx.stroke();
      }
      for(let y=0;y<canvas.height;y+=tileSize){
        ctx.beginPath();ctx.moveTo(0,y+offsetY%tileSize);ctx.lineTo(canvas.width,y+offsetY%tileSize);ctx.stroke();
      }
    }

    function downloadJSON(){
      const data=JSON.stringify({
        map:mapData,
        textures:textures.map(t=>t.url),
        tags,
        viewMode
      },null,2);
      const blob=new Blob([data],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='tilemap.json';
      a.click();
    }

    function importJSON(event){
      const file=event.target.files[0];
      const reader=new FileReader();
      reader.onload=e=>{
        const obj=JSON.parse(e.target.result);
        mapData=obj.map||{};
        tags=obj.tags||[];
        viewMode=obj.viewMode||"static";
        updateTagsUI();
        updateViewModeUI();
        textures=[];
        (obj.textures||[]).forEach(url=>{
          const img=new Image();
          img.src=url;
          img.onload=()=>draw();
          textures.push({url,img});
        });
        updateTexturesUI();
        draw();
      };
      reader.readAsText(file);
    }

    document.addEventListener('keydown', e=>{
      if(e.ctrlKey && e.key==='z'){ e.preventDefault(); undo(); }
      if(e.ctrlKey && e.key==='y'){ e.preventDefault(); redo(); }
      if(!e.ctrlKey){
        if(e.key==='1') setTool('move');
        if(e.key==='2') setTool('paint');
        if(e.key==='3') setTool('erase');
        if(e.key==='4') openEventModal();
        if(e.key==='5') clearAllConfirm();
      }
    });

    // Ajustar el tamaño del canvas cuando se redimensiona la ventana
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth - 600;
      canvas.height = window.innerHeight;
      draw();
    });

    draw();
    updateViewModeUI(); // inicializar radios
  </script>
</body>
</html>
